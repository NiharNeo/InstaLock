name: intentlock-webhook
services:
  ingress:
    image: intentlock-local-web:latest
    entrypoint: [nginx]
    command: [-g, 'daemon off;']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - ./webhook-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [ledger, edge]
    restart: unless-stopped
  tunnel:
    image: cloudflare/cloudflared:latest
    command: [tunnel, --no-autoupdate, --protocol, http2, --url, 'http://ingress:8080']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    depends_on: [ingress]
    restart: unless-stopped
networks:
  ledger:
    external: true
    name: ${INTENTLOCK_NETWORK:-intentlock-local_default}
  edge: {}
