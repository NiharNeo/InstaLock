# Public prototype ingress. Sessions and grants are enforced by the gateway;
# executor RPC, runtime files and dotfiles never cross this boundary.
server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $workspace http://web:8080;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ~ ^/(internal|\.runtime|\.git)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location / {
        proxy_pass $workspace;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
