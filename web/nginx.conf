server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    client_max_body_size 128k;
    location /public/ { proxy_pass http://gateway:8000; }
    location /v1/ { proxy_pass http://gateway:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
