server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    client_max_body_size 128k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8000;
    set $executor http://executor:8001;
    location = /health/live { access_log off; default_type application/json; return 200 '{"status":"live"}'; }
    location = /health/ready { proxy_pass $gateway; }
    location = /v1/webhooks/razorpay { proxy_pass $executor; }
    location /public/ { proxy_pass $gateway; proxy_set_header Host $host; }
    location /v1/ { proxy_pass $gateway; }
    location /store/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.razorpay.com; connect-src 'self' https://api.razorpay.com https://checkout.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com" always;
        try_files $uri /index.html =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
