server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    client_max_body_size 128k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8000;
    set $executor http://executor:8001;
    location = /health/live { access_log off; default_type application/json; return 200 '{"status":"live"}'; }
    location = /health/ready { proxy_pass $gateway; }
    location = /v1/webhooks/razorpay { proxy_pass $executor; }
    location /public/ { proxy_pass $gateway; }
    location /v1/ { proxy_pass $gateway; }
    location / { try_files $uri $uri/ /index.html; }
}
