[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "intentlock"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "cryptography>=44", "rfc8785>=0.1.4,<1", "uvicorn>=0.34,<1", "PyJWT[crypto]>=2.10,<3", "PyYAML>=6,<7", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "hypothesis>=6,<7"]

[tool.setuptools.packages.find]
include = ["intentlock*", "app*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
