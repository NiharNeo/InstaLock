<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IntentLock · Customer support</title><link rel="stylesheet" href="/console.css"><script type="module" src="/support.js"></script></head><body class="support"><main><header><a class="brand" href="/">◈ IntentLock</a><span class="eyebrow">CUSTOMER SUPPORT</span><h1>We’ll review<br>your request.</h1><p>A support request starts a review. Every refund still requires explicit operator approval.</p></header><form class="panel" id="ticket-form"><label>Support channel<input id="channel" maxlength="128" required></label><label>Order reference<input id="order" maxlength="128" placeholder="Your order ID, if available"></label><label>Your request<textarea id="text" maxlength="16000" required placeholder="Tell us what happened and the refund amount you’re requesting."></textarea></label><button id="submit">Submit support request ↗</button><p id="result" role="status" aria-live="polite"></p></form><footer>Automated assistance receives masked text. Please omit card numbers, passwords and identity documents.</footer></main></body></html>
